<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Inventory Management System</h1>

    <input type="text" id="productName" placeholder="Product Name">

    <input type="number" id="productQuantity" placeholder="Quantity">

    <button id="addBtn">Add Product</button>

    <button id="displayBtn">Display All Products</button>

    <button id="outOfStockBtn">Show Out of Stock</button>

    <br><br>

    <input type="text" id="searchInput" placeholder="Search Product">

    <button id="searchBtn">Search</button>

    <br><br>

    <input type="text" id="updateName" placeholder="Product Name">

    <input type="number" id="updateQuantity" placeholder="New Quantity">

    <button id="updateBtn">Update Quantity</button>

    <hr>

    <div id="output"></div>

    <script src="script.js"></script>
</body>
</html>
